<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#122a42" />
  <title>SISCF — Vídeo</title>
  <style>
    :root {
      --bg: #0f2236;
      --panel: #16324c;
      --text: #f5f2ec;
      --gold: #c4a062;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at top, #1a3a55 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }
    h1 {
      font-size: 1.75rem;
      letter-spacing: 0.04em;
      font-weight: 700;
    }
    p {
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      opacity: 0.9;
      text-align: center;
      line-height: 1.45;
    }
    .player {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      aspect-ratio: 9 / 16;
      max-height: 78vh;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--gold);
      color: #1a1205;
    }
    a.btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(245, 242, 236, 0.35);
    }
  </style>
</head>
<body>
  <main>
    <h1>SISCF</h1>
    <p>Sua funerária na palma da sua mão.<br />Toque no vídeo para assistir.</p>
    <div class="player">
      <video
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        poster=""
        src="video.mp4"
      >
        Seu navegador não reproduz este vídeo.
      </video>
    </div>
    <div class="actions">
      <a class="btn" href="video.mp4" download="siscf-video.mp4">Baixar vídeo (MP4)</a>
      <a class="btn secondary" href="video.mp4" target="_blank" rel="noopener">Abrir arquivo direto</a>
    </div>
  </main>
</body>
</html>
